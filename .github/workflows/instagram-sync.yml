name: Instagram Feed Reference Check

on:
  schedule:
    # Run every 6 hours automatically
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allow manual 1-click trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-instagram:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify existing Instagram feed references
        run: node scripts/sync-instagram.mjs

      - name: Commit & push if feed updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/instagram-feed.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(instagram): record verified feed reference check"
            git push origin main
          else
            echo "No feed changes detected."
          fi
